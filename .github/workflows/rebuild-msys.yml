name: Rebuild MSYS Environment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haitun-oss-publish
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          release: true
          update: true
          install: >-
            bash coreutils grep sed gawk findutils diffutils which
            git openssh curl rsync tar gzip less nano
            mingw-w64-ucrt-x86_64-nodejs mingw-w64-ucrt-x86_64-uv
      - shell: pwsh
        run: |
          robocopy "${{ steps.msys2.outputs.msys2-location }}" "examples\haitun-workspace\msys64" /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }
      - shell: pwsh
        run: Remove-Item -Recurse -Force "examples\haitun-workspace\msys64\var\cache\pacman\pkg\*" -ErrorAction SilentlyContinue
      - name: Compute fingerprint
        shell: pwsh
        run: |
          $fp = & ".github\inno-setup\compute-msys-fingerprint.ps1" -MsysDir "examples\haitun-workspace\msys64"
          Write-Output "MSYS_FINGERPRINT=$fp" >> $env:GITHUB_ENV
      - name: Package frozen environment
        shell: pwsh
        run: |
          $archive = & ".github\inno-setup\package-msys-env.ps1" `
            -MsysDir "examples\haitun-workspace\msys64" `
            -Fingerprint "$env:MSYS_FINGERPRINT" `
            -OutputDir "env-output"
          Write-Output "MSYS_ARCHIVE_PATH=$archive" >> $env:GITHUB_ENV
      - run: choco install innosetup --no-progress
      - shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile ".github\inno-setup\ChineseSimplified.isl"
      - name: Build msys installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp /DCOMPONENT_MSYS /DMSYS_FINGERPRINT="$env:MSYS_FINGERPRINT" /O"env-output" ".github\inno-setup\haitun.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "MSYS_SETUP_PATH=env-output/msys-setup.exe" >> $env:GITHUB_ENV
      - name: Upload frozen environment to OSS
        shell: bash
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX }}
          MSYS_FINGERPRINT: ${{ env.MSYS_FINGERPRINT }}
          MSYS_ARCHIVE_PATH: ${{ env.MSYS_ARCHIVE_PATH }}
          MSYS_SETUP_PATH: ${{ env.MSYS_SETUP_PATH }}
        run: |
          python3 -m pip install --quiet oss2
          python3 .github/inno-setup/upload_msys_env.py
      - name: Summary
        shell: bash
        run: |
          echo "Fingerprint: ${{ env.MSYS_FINGERPRINT }}"
          echo "Archive: ${{ env.MSYS_ARCHIVE_PATH }}"
          echo "Installer: ${{ env.MSYS_SETUP_PATH }}"
